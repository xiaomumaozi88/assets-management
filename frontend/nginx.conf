server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 子路径 /assets-management/ 下的 SPA
    location /assets-management/ {
        try_files $uri $uri/ /assets-management/index.html;
    }
    location = /assets-management {
        return 301 /assets-management/;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
